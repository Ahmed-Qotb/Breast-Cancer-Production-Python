
[project]
name = "task-1"
version = "0.1.0"
description = "ML production assignment"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.148.0",
    "imbalanced-learn",
    "joblib",
    "matplotlib",
    "pandas",
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
    "python-dotenv",
    "scikit-learn",
    "seaborn",
    "streamlit>=1.66.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx2>=2.16.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
