services:
  api:
    build: .
    command: uv run uvicorn production_app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: models/model.joblib
      DATA_PATH: data/data.csv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: .
    command: uv run streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      DATA_PATH: data/data.csv
    depends_on:
      api:
        condition: service_healthy